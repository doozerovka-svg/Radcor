<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="checkout_text_title">Оформление заказа — Radcor-Prim</title>
  <link rel="stylesheet" href="style.css?v=43.0">
</head>
<body>
  <header class="main-header"><div class="header-container"><a href="index.html" class="logo"><span class="logo-accent">R</span>ADCOR<span class="logo-sub">prim</span></a><nav class="main-nav"><ul class="nav-links"><li><a href="catalog.html" data-i18n="nav_catalog">Каталог</a></li><li><a href="delivery.html" data-i18n="nav_delivery">Доставка и оплата</a></li><li><a href="contacts.html" data-i18n="nav_contacts">Контакты</a></li></ul><div class="nav-actions"><div class="lang-selector"><a href="#" class="lang-link active">RU</a><span>|</span><a href="#" class="lang-link">RO</a></div></div></nav></div><div class="header-gauge-line"></div></header>
  <main class="dashboard-main container checkout-page">
    <div class="section-title-wrap"><span class="eyebrow" data-i18n="checkout_b2b">B2B-заказ</span><h1 data-i18n="checkout_text_h1">Оформление заказа</h1><p data-i18n="checkout_text_p">Проверьте товары и оставьте контакты — менеджер подтвердит наличие и условия.</p></div>
    <div id="checkoutMessage" class="form-success-msg" role="status" aria-live="polite"></div>
    <div class="dashboard-widgets-grid">
      <section class="dashboard-card double-border"><h2 data-i18n="checkout_1">1. Контакт</h2><form id="checkoutForm" novalidate>
        <div class="form-group"><label for="companyName" data-i18n="checkout_text_label">Компания</label><input id="companyName" required autocomplete="organization"></div>
        <div class="form-group"><label for="contactName" data-i18n="catalog_text_label_79">Контактное лицо</label><input id="contactName" required autocomplete="name"></div>
        <div class="form-group"><label for="orderPhone" data-i18n="catalog_text_label_80">Телефон</label><input id="orderPhone" required type="tel" autocomplete="tel"></div>
        <div class="form-group"><label for="orderEmail">Email</label><input id="orderEmail" type="email" autocomplete="email"></div>
        <h2 data-i18n="checkout_2">2. Получение и оплата</h2>
        <div class="form-group"><label for="deliveryMethod" data-i18n="checkout_text_label_88">Способ получения</label><select id="deliveryMethod"><option value="pickup" data-i18n="opt_pickup">Самовывоз</option><option value="delivery" data-i18n="opt_delivery">Доставка</option></select></div>
        <div id="deliveryFields" hidden><div class="form-group"><label for="deliveryCity" data-i18n="checkout_text_label_89">Город</label><input id="deliveryCity"></div><div class="form-group"><label for="deliveryAddress" data-i18n="checkout_text_label_90">Адрес</label><input id="deliveryAddress"></div></div>
        <div class="form-group"><label for="paymentMethod" data-i18n="checkout_text_label_91">Оплата</label><select id="paymentMethod"><option value="invoice" data-i18n="opt_invoice">Безналичный счёт</option><option value="contract" data-i18n="opt_contract">По договору</option></select></div>
        <div class="form-group"><label for="orderComment" data-i18n="checkout_text_label_94">Комментарий к заказу</label><textarea id="orderComment" rows="3"></textarea></div>
        <button class="btn btn-primary" type="submit" data-i18n="checkout_text_button">Отправить заказ</button>
      </form></section>
      <aside class="dashboard-card double-border"><h2 data-i18n="checkout_text_h2">Ваш заказ</h2><div id="checkoutItems"></div><p id="checkoutTotal" class="code-font text-amber"></p><a href="catalog.html" class="btn btn-secondary" data-i18n="b2b_dashboard_text_a_21">Вернуться в каталог</a></aside>
    </div>
  </main>
  <script src="i18n.js?v=43.0"></script>
    <script src="app.js?v=43.0"></script>
    <script src="checkout.js?v=43.0"></script>
</body>
</html>
